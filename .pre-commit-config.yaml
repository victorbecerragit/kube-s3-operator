repos:
  - repo: https://github.com/TekWizely/pre-commit-golang
    rev: v1.0.0-rc.4  # Pin latest stable [web:68]
    hooks:
      #- id: go-fmt-repo
      - id: go-mod-tidy
      - id: go-build-mod
        #- id: go-test-mod  # Short unit tests
        #- id: go-vet-mod
        #- id: golangci-lint
    # Optional: args for stricter, e.g., ['--fast=false'] for full lint
  - repo: https://github.com/golangci/golangci-lint  # Your current, fallback/custom
    rev: v2.10.1
    hooks:
      - id: golangci-lint
        name: golangci-lint in ./code (verbose)
        entry: bash -c 'cd code && ../golangci-lint run -v'
        pass_filenames: false

