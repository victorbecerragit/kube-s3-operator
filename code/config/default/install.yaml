  group: s3.acme.io
  names:
    kind: S3Bucket
    listKind: S3BucketList
    plural: s3buckets
    singular: s3bucket
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: The name of the S3 bucket
      jsonPath: .spec.name
      name: Bucket Name
      type: string
    - description: The AWS region of the S3 bucket
      jsonPath: .spec.region
      name: Region
      type: string
    - description: The current state of the S3 bucket
      jsonPath: .status.state
      name: State
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: S3Bucket is the Schema for the s3buckets API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: S3BucketSpec defines the desired state of S3Bucket.
            properties:
              locked:
                description: Locked indicates if the bucket is locked for deletion
                type: boolean
              name:
                description: Name is the name of the S3 bucket
                type: string
              region:
                description: Region is the AWS region where the bucket will be created
                type: string
            type: object
          status:
            description: S3BucketStatus defines the observed state of S3Bucket.
            properties:
              state:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
