apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kube-s3-operator.clustername" . }}-manager-role
  labels:
  {{- include "kube-s3-operator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - s3.acme.io
  resources:
  - s3buckets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - s3.acme.io
  resources:
  - s3buckets/finalizers
  verbs:
  - update
- apiGroups:
  - s3.acme.io
  resources:
  - s3buckets/status
  verbs:
  - get
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kube-s3-operator.clustername" . }}-manager-rolebinding
  labels:
  {{- include "kube-s3-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: '{{ include "kube-s3-operator.fullname" . }}-manager-role'
subjects:
- kind: ServiceAccount
  name: '{{ include "kube-s3-operator.fullname" . }}-controller-manager'
  namespace: '{{ .Release.Namespace }}'
