apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "clusterRoleName" . }}-s3bucket-editor-role
  labels:
  {{- include "kube-s3-operator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - s3.acme.io
  resources:
  - s3buckets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - s3.acme.io
  resources:
  - s3buckets/status
  verbs:
  - get
