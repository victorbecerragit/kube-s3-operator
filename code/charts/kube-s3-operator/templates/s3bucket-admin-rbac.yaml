apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "clusterRoleName" . }}-s3bucket-admin-role
  labels:
  {{- include "kube-s3-operator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - s3.acme.io
  resources:
  - s3buckets
  verbs:
  - '*'
- apiGroups:
  - s3.acme.io
  resources:
  - s3buckets/status
  verbs:
  - get
