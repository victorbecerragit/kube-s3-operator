controllerManager:
  manager:
    args:
    - --metrics-bind-address=:8443
    - --leader-elect
    - --health-probe-bind-address=:8081
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
    image:
      repository: victorbecerra/kube-s3-controller
      tag: latest
    imagePullPolicy: IfNotPresent
    resources:
      limits:
        cpu: 500m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 64Mi
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  replicas: 2
  serviceAccount:
    annotations: {}
# AWS Configuration
# Set awsCredentials.enabled to true to use AWS credentials from a secret
# The secret must exist in the same namespace before deployment
awsCredentials:
  enabled: false
  # Secret name containing AWS credentials
  secretName: aws-secret
  # Secret keys for AWS credentials
  accessKeyIdKey: aws-access-key-id
  secretAccessKeyKey: aws-secret-access-key

kubernetesClusterDomain: cluster.local
metricsService:
  ports:
  - name: https
    port: 8443
    protocol: TCP
    targetPort: 8443
  type: ClusterIP
