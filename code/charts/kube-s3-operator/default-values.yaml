# Default Helm Chart Values for kube-s3-operator
# Version: 0.2.0
# 
# Key Updates:
# - AWS SDK v2 migration (replaced deprecated v1)
# - Go 1.25.0 runtime
# - Kubernetes v0.35.1 compatibility
# - Controller Runtime v0.23.1
# - Ginkgo v2.28.1 & Gomega v1.39.0 for testing
#
# See values.yaml for customization options

controllerManager:
  manager:
    args:
    - --metrics-bind-address=:8443
    - --leader-elect
    - --health-probe-bind-address=:8081
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
    image:
      repository: victorbecerra/kube-s3-controller
      tag: latest
    imagePullPolicy: IfNotPresent
    resources:
      limits:
        cpu: 500m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 64Mi
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  replicas: 2
  serviceAccount:
    annotations: {}
kubernetesClusterDomain: cluster.local
metricsService:
  ports:
  - name: https
    port: 8443
    protocol: TCP
    targetPort: 8443
  type: ClusterIP
