name: Publish Helm Chart

on:
  push:
    tags:
      - 'v*'   # Trigger on version tags like v0.1.1

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Helm
      uses: azure/setup-helm@v4

    - name: Package Helm chart
      run: |
        helm package code/charts/kube-s3-operator --destination .deploy

    - name: Update Helm repo index
      run: |
        mkdir -p .deploy
        helm repo index .deploy --url https://victorbecerragit.github.io/kube-s3-operator --merge .deploy/index.yaml || true

    - name: Commit and push changes
      uses: EndBug/add-and-commit@v9
      with:
        author_name: 'github-actions[bot]'
        author_email: 'github-actions[bot]@users.noreply.github.com'
        message: "Publish Helm chart version ${{ github.ref_name }}"
        add: '.deploy/*'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Push to gh-pages branch
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git switch --orphan gh-pages
        git rm -rf .
        mkdir -p .deploy
        cp -r .deploy/* .
        git add .
        git commit -m "Publish Helm chart version ${{ github.ref_name }}"
        git push --force origin gh-pages
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

