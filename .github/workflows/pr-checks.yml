name: Quick PR Checks

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'code/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    name: Lint & Format Check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: code/go.sum

      - name: Run linters
        working-directory: ./code
        run: |
          echo "Running gofmt check..."
          if [ -n "$(gofmt -l .)" ]; then
            echo "❌ Code formatting issues found!"
            gofmt -d .
            exit 1
          fi
          echo "✅ gofmt check passed"

          echo ""
          echo "Running go vet..."
          go vet ./...
          echo "✅ go vet passed"

      - name: Check for commented-out code
        working-directory: ./code
        run: |
          echo "Checking for commented code patterns..."
          if grep -r "^[[:space:]]*//.*\(TODO\|FIXME\|DEBUG\|HACK\)" --include="*.go" | grep -v "// nolint\|// +\|// Copyright"; then
            echo "⚠️  Found TODO/FIXME comments - please address them before merging"
          fi


  manifest-validation:
    runs-on: ubuntu-latest
    name: Manifest Validation
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: code/go.sum

      - name: Generate manifests
        working-directory: ./code
        run: |
          echo "Generating CRD and RBAC manifests..."
          make manifests generate
          echo "✅ Manifests generated successfully"

      - name: Check for uncommitted manifest changes
        working-directory: ./code
        run: |
          if git diff --quiet; then
            echo "✅ No uncommitted manifest changes"
          else
            echo "❌ Manifest files have uncommitted changes!"
            echo "Please run 'make manifests generate' and commit the changes."
            git diff
            exit 1
          fi

  pr-check-summary:
    runs-on: ubuntu-latest
    name: PR Check Summary
    needs: [lint-and-format, manifest-validation]
    if: always()
    steps:
      - name: Verify all checks passed
        run: |
          if [ "${{ needs.lint-and-format.result }}" != "success" ] || \
             [ "${{ needs.manifest-validation.result }}" != "success" ]; then
            echo "❌ Some PR checks failed!"
            echo "Lint & Format: ${{ needs.lint-and-format.result }}"
            echo "Manifest Validation: ${{ needs.manifest-validation.result }}"
            exit 1
          fi
          echo "✅ All PR checks passed!"
