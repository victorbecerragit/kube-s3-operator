name: Weekly S3 Trends

permissions:
  contents: write

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'code/**'

concurrency:
  group: weekly-s3-trends
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    env:
      SEARCH_QUERY: "S3-compatible storage news releases MinIO Ceph RGW Wasabi Cloudflare R2"
      SEARCH_ENGINE: "google"
      NUM_RESULTS: "5"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: code/go.mod
          cache: true
          cache-dependency-path: code/go.sum

      - name: Fetch S3 ecosystem results
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          if [ -z "${SERPAPI_KEY}" ]; then
            echo "SERPAPI_KEY secret is not set." >&2
            exit 1
          fi
          docker run --rm \
            -e SERPAPI_KEY \
            -e SEARCH_QUERY \
            -e SEARCH_ENGINE \
            -e NUM_RESULTS \
            victorbecerra/serp-api-go:latest > /tmp/serp-output.txt

      - name: Update README with trends
        run: |
          cd code
          go run ./tools/readme_trends --input /tmp/serp-output.txt --readme ../README.md --max 5

      - name: Commit and push updates
        run: |
          if git diff --quiet; then
            echo "No README changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update S3 ecosystem trends"
          git push
